name: Lint and tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - release

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install .[dev]
          pip install .[test]
      - name: Run critical lint
        run: ruff check --select E9,F63,F7,F82 netbox_contract
      - name: Run strict revenue lint
        run: >-
          ruff check
          netbox_contract/services
          testing/run_fast_tests.py
          netbox_contract/tests/test_revenue_timeline.py
          netbox_contract/tests/test_revenue_portfolio.py
          netbox_contract/tests/test_revenue_view_filters.py
          netbox_contract/tests/test_datetime_utc_save.py
          netbox_contract/tests/test_detail_pagination.py
      - name: Report historical lint debt
        continue-on-error: true
        run: ruff check . --statistics
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
      - name: Run pure revenue tests
        run: python testing/run_fast_tests.py
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout netbox-contract
        uses: actions/checkout@v4
        with:
          path: netbox-contract
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout netbox
        uses: actions/checkout@v4
        with:
          repository: "netbox-community/netbox"
          ref: "v4.6.2"
          path: netbox
      - name: Install NetBox dependencies & configure plugin
        working-directory: netbox
        run: |
          ln -sfn $(pwd)/../netbox-contract/testing/configuration.py netbox/netbox/configuration.py
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install netbox-contract
        working-directory: netbox-contract
        run: pip install -e ".[test]"
      - name: Run tests
        working-directory: netbox
        run: |
          python netbox/manage.py test netbox_contract.tests --noinput
